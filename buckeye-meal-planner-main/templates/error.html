<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | BuckeyeMealPlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="osu-topbar">
        <div class="container">
            <a href="/" class="osu-logo">BuckeyeMealPlanner</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span id="themeIcon">&#9790;</span>
            </button>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="section-card">
                    <div class="card-header">Error</div>
                    <div class="card-body text-center py-5">
                        <h2 class="h4 mb-3">Something went wrong</h2>
                        <p class="text-muted mb-4">{{ error }}</p>
                        {% if raw_response %}
                        <details class="text-start mb-4">
                            <summary class="text-muted small">View raw AI response</summary>
                            <pre class="bg-light p-3 rounded mt-2 small"
                                style="max-height:300px;overflow-y:auto">{{ raw_response }}</pre>
                        </details>
                        {% endif %}
                        <a href="/" class="btn btn-osu">Try Again</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="osu-footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 BuckeyeMealPlanner</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>

</html>
