<div class="page-header">
  <h1>My Requests</h1>
  <a mat-raised-button color="primary" routerLink="/dashboard/requests/new">
    <mat-icon>add</mat-icon> New Request
  </a>
</div>

@if (loading) {
  <mat-spinner diameter="40" class="spinner" />
}

<div class="table-container mat-elevation-z2">
  <table mat-table [dataSource]="requests">
    <ng-container matColumnDef="requestNumber">
      <th mat-header-cell *matHeaderCellDef>Number</th>
      <td mat-cell *matCellDef="let r">
        <a [routerLink]="['/dashboard/requests', r.id]">{{ r.requestNumber }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let r">{{ r.title }}</td>
    </ng-container>

    <ng-container matColumnDef="requestTypeName">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let r">{{ r.requestTypeName }}</td>
    </ng-container>

    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef>Priority</th>
      <td mat-cell *matCellDef="let r">
        <app-status-badge [status]="r.priority" />
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let r">
        <app-status-badge [status]="r.status" />
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let r">{{ r.createdAt | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let r">
        <a mat-icon-button [routerLink]="['/dashboard/requests', r.id]" title="View">
          <mat-icon>visibility</mat-icon>
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    @if (!loading && requests.length === 0) {
      <tr class="mat-row">
        <td [attr.colspan]="displayedColumns.length" class="empty-row">
          No requests yet. <a routerLink="/dashboard/requests/new">Create your first request.</a>
        </td>
      </tr>
    }
  </table>

  <mat-paginator
    [length]="totalElements"
    [pageSize]="20"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)"
  />
</div>

<style>
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .table-container { overflow-x: auto; }
  .spinner { display: block; margin: 32px auto; }
  .empty-row { text-align: center; padding: 32px; color: #9e9e9e; }
  a { text-decoration: none; color: #3f51b5; }
</style>
