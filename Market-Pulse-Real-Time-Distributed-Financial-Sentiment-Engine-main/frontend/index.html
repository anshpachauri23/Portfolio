<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Sentiment Feed</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-gray-100 font-mono">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [messages, setMessages] = useState([]);
            const [connectionStatus, setConnectionStatus] = useState('CONNECTING...');
            const [messagesPerSecond, setMessagesPerSecond] = useState(0);
            const wsRef = useRef(null);
            const messageTimestamps = useRef([]);
            const velocityData = useRef([]); // Store last 60 seconds of data

            useEffect(() => {
                // Connect to WebSocket
                const connectWebSocket = () => {
                    try {
                        const ws = new WebSocket('ws://localhost:8000/ws');
                        wsRef.current = ws;

                        ws.onopen = () => {
                            setConnectionStatus('CONNECTED');
                            console.log('WebSocket connected');
                        };

                        ws.onmessage = (event) => {
                            try {
                                const data = JSON.parse(event.data);
                                
                                // Add timestamp for tracking
                                const now = Date.now();
                                const messageWithTimestamp = {
                                    ...data,
                                    receivedAt: now
                                };

                                // Track message timestamps for velocity calculation
                                messageTimestamps.current.push(now);
                                
                                // Keep only last 60 seconds
                                messageTimestamps.current = messageTimestamps.current.filter(
                                    timestamp => now - timestamp < 60000
                                );

                                // Update velocity data (store per second)
                                const currentSecond = Math.floor(now / 1000);
                                const lastEntry = velocityData.current[velocityData.current.length - 1];
                                
                                if (lastEntry && lastEntry.second === currentSecond) {
                                    lastEntry.count++;
                                } else {
                                    velocityData.current.push({ second: currentSecond, count: 1 });
                                    // Keep only last 60 seconds
                                    if (velocityData.current.length > 60) {
                                        velocityData.current.shift();
                                    }
                                }

                                // Update messages list (keep last 100)
                                setMessages(prevMessages => {
                                    const newMessages = [messageWithTimestamp, ...prevMessages];
                                    return newMessages.slice(0, 100);
                                });
                            } catch (error) {
                                console.error('Error parsing WebSocket message:', error);
                            }
                        };

                        ws.onerror = (error) => {
                            console.error('WebSocket error:', error);
                            setConnectionStatus('ERROR');
                        };

                        ws.onclose = () => {
                            setConnectionStatus('DISCONNECTED');
                            console.log('WebSocket disconnected');
                            // Attempt to reconnect after 3 seconds
                            setTimeout(connectWebSocket, 3000);
                        };
                    } catch (error) {
                        console.error('Error connecting to WebSocket:', error);
                        setConnectionStatus('CONNECTION FAILED');
                        setTimeout(connectWebSocket, 3000);
                    }
                };

                connectWebSocket();

                // Cleanup on unmount
                return () => {
                    if (wsRef.current) {
                        wsRef.current.close();
                    }
                };
            }, []);

            // Update velocity every second
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = Date.now();
                    const oneSecondAgo = now - 1000;
                    
                    // Count messages in last second
                    const recentMessages = messageTimestamps.current.filter(
                        timestamp => timestamp > oneSecondAgo
                    );
                    
                    setMessagesPerSecond(recentMessages.length);
                }, 100);

                return () => clearInterval(interval);
            }, []);

            const formatTime = (timestamp) => {
                if (!timestamp) return '--:--:--';
                try {
                    const date = new Date(timestamp);
                    return date.toLocaleTimeString('en-US', { 
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                } catch {
                    return '--:--:--';
                }
            };

            const getImpact = (message) => {
                return message.impact || 'NEUTRAL';
            };

            const getRowColor = (impact) => {
                if (impact === 'POSITIVE') {
                    return 'text-green-500';
                } else if (impact === 'NEGATIVE') {
                    return 'text-red-500';
                } else {
                    return 'text-gray-600';
                }
            };

            const getArrowIcon = (impact) => {
                if (impact === 'POSITIVE') {
                    return '↑';
                } else if (impact === 'NEGATIVE') {
                    return '↓';
                }
                return '';
            };

            const getMaxVelocity = () => {
                if (velocityData.current.length === 0) return 1;
                return Math.max(...velocityData.current.map(d => d.count), 1);
            };

            return (
                <div className="min-h-screen bg-slate-900 p-4">
                    {/* Header */}
                    <div className="mb-4 border-b border-slate-700 pb-4">
                        <div className="flex items-center justify-between">
                            <h1 className="text-2xl font-bold text-green-400">MARKET SENTIMENT FEED</h1>
                            <div className={`text-xs px-3 py-1 rounded ${
                                connectionStatus === 'CONNECTED' 
                                    ? 'bg-green-900 text-green-400' 
                                    : 'bg-red-900 text-red-400'
                            }`}>
                                {connectionStatus}
                            </div>
                        </div>
                    </div>

                    {/* Market Velocity Chart */}
                    <div className="mb-6 bg-slate-800 border border-slate-700 p-4 rounded">
                        <div className="flex items-center justify-between mb-2">
                            <h2 className="text-sm font-semibold text-gray-300">MARKET VELOCITY</h2>
                            <div className="text-right">
                                <div className="text-2xl font-bold text-green-400">{messagesPerSecond}</div>
                                <div className="text-xs text-gray-500">msg/sec</div>
                            </div>
                        </div>
                        <div className="h-24 flex items-end gap-1">
                            {velocityData.current.map((data, index) => {
                                const maxVel = getMaxVelocity();
                                const height = (data.count / maxVel) * 100;
                                return (
                                    <div
                                        key={index}
                                        className="flex-1 bg-green-500 min-h-[2px]"
                                        style={{ height: `${height}%` }}
                                        title={`${data.count} msg/sec`}
                                    />
                                );
                            })}
                        </div>
                    </div>

                    {/* Messages Table */}
                    <div className="bg-slate-800 border border-slate-700 rounded overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs">
                                <thead>
                                    <tr className="bg-slate-900 border-b border-slate-700">
                                        <th className="px-4 py-2 text-left text-gray-400 font-semibold">TIME</th>
                                        <th className="px-4 py-2 text-left text-gray-400 font-semibold">TICKER</th>
                                        <th className="px-4 py-2 text-left text-gray-400 font-semibold">HEADLINE</th>
                                        <th className="px-4 py-2 text-left text-gray-400 font-semibold">IMPACT</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {messages.length === 0 ? (
                                        <tr>
                                            <td colSpan="4" className="px-4 py-8 text-center text-gray-600">
                                                WAITING FOR MARKET DATA...
                                            </td>
                                        </tr>
                                    ) : (
                                        messages.map((message, index) => {
                                            const impact = getImpact(message);
                                            const rowColor = getRowColor(impact);
                                            const arrowIcon = getArrowIcon(impact);
                                            return (
                                                <tr 
                                                    key={message.id || index}
                                                    className={`border-b border-slate-700 hover:bg-slate-700 transition-colors ${rowColor}`}
                                                >
                                                    <td className="px-4 py-2 font-mono">
                                                        {formatTime(message.timestamp)}
                                                    </td>
                                                    <td className="px-4 py-2 font-bold">
                                                        {arrowIcon && <span className="mr-1">{arrowIcon}</span>}
                                                        {message.ticker || 'N/A'}
                                                    </td>
                                                    <td className="px-4 py-2">
                                                        {message.headline || 'No headline'}
                                                    </td>
                                                    <td className="px-4 py-2 font-bold">
                                                        {impact}
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Footer Stats */}
                    <div className="mt-4 text-xs text-gray-600 flex justify-between">
                        <span>TOTAL MESSAGES: {messages.length}</span>
                        <span className="text-green-500">POSITIVE: {messages.filter(m => getImpact(m) === 'POSITIVE').length}</span>
                        <span className="text-red-500">NEGATIVE: {messages.filter(m => getImpact(m) === 'NEGATIVE').length}</span>
                        <span className="text-gray-600">NEUTRAL: {messages.filter(m => getImpact(m) === 'NEUTRAL').length}</span>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
